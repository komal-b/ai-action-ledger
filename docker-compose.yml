services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://ledger:ledger@postgres:5432/ledger

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.workers.retry_worker
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://ledger:ledger@postgres:5432/ledger
  
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
