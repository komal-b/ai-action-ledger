<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Action Ledger</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface-2: #222222;
    --border: #2e2e2e;
    --text: #e8e8e8;
    --text-muted: #666;
    --text-dim: #999;
    --green: #22c55e;
    --green-bg: #0d2b1a;
    --red: #ef4444;
    --red-bg: #2b0d0d;
    --amber: #f59e0b;
    --amber-bg: #2b1f0d;
    --blue: #3b82f6;
    --blue-bg: #0d1a2b;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    width: 24px;
    height: 24px;
    background: var(--blue);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: white;
  }

  .topbar h1 {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .main {
    padding: 1.25rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.875rem 1rem;
  }

  .metric-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  .metric-value {
    font-size: 22px;
    font-weight: 500;
    font-family: var(--mono);
  }

  .metric-value.green { color: var(--green); }
  .metric-value.red { color: var(--red); }
  .metric-value.amber { color: var(--amber); }

  .columns {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 1rem;
    align-items: start;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .panel-header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .panel-body { padding: 1rem; }

  .form-group { margin-bottom: 0.75rem; }
  .form-group:last-of-type { margin-bottom: 1rem; }

  label {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  input, select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    font-size: 12px;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--blue);
  }

  select { cursor: pointer; }

  textarea {
    font-family: var(--mono);
    font-size: 11px;
    height: 80px;
    resize: none;
    line-height: 1.6;
  }

  .key-input {
    font-family: var(--mono);
    font-size: 11px;
  }

  .btn {
    width: 100%;
    padding: 8px 12px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .response-box {
    margin-top: 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    min-height: 60px;
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.7;
  }

  .response-box.success { border-color: var(--green); color: var(--green); }
  .response-box.duplicate { border-color: var(--amber); color: var(--amber); }
  .response-box.error { border-color: var(--red); color: var(--red); }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }

  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--surface-2); }
  tr.selected td { background: #0d1a2b; }

  .mono-sm {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
  }

  .type-badge {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .badge-succeeded { background: var(--green-bg); color: var(--green); }
  .badge-failed { background: var(--red-bg); color: var(--red); }
  .badge-dead { background: #1a1a1a; color: var(--text-muted); border: 1px solid var(--border); }
  .badge-pending { background: var(--blue-bg); color: var(--blue); }
  .badge-executing { background: var(--amber-bg); color: var(--amber); }

  .empty-state {
    padding: 2.5rem 1rem;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
  }

  .audit-panel { margin-top: 1rem; }

  .audit-header {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .audit-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .audit-meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
  }

  .timeline { padding: 0.75rem 1rem; }

  .timeline-item {
    display: flex;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }

  .timeline-item:last-child { border-bottom: none; }

  .tl-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 4px;
    flex-shrink: 0;
  }

  .tl-dot-created { background: var(--text-muted); }
  .tl-dot-executing { background: var(--amber); }
  .tl-dot-succeeded { background: var(--green); }
  .tl-dot-failed { background: var(--red); }
  .tl-dot-dead { background: var(--text-muted); }
  .tl-dot-replayed { background: var(--blue); }

  .tl-content { flex: 1; }

  .tl-event {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
  }

  .tl-time {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .tl-payload {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    word-break: break-all;
  }

  .loading { color: var(--text-muted); font-size: 12px; padding: 1rem; text-align: center; }

  .retry-info {
    font-size: 11px;
    color: var(--amber);
    font-family: var(--mono);
  }

  .right-col { display: flex; flex-direction: column; gap: 1rem; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">AL</div>
    <h1>AI Action Ledger</h1>
  </div>
  <div class="topbar-right">
    <div class="status-dot"></div>
    API: localhost:8000
  </div>
</div>

<div class="main">

  <div class="metrics">
    <div class="metric">
      <div class="metric-label">Total</div>
      <div class="metric-value" id="m-total">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Succeeded</div>
      <div class="metric-value green" id="m-succeeded">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Failed</div>
      <div class="metric-value red" id="m-failed">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Dead</div>
      <div class="metric-value amber" id="m-dead">—</div>
    </div>
  </div>

  <div class="columns">

    <div class="panel">
      <div class="panel-header">Submit action</div>
      <div class="panel-body">
        <div class="form-group">
          <label>Idempotency key</label>
          <input class="key-input" id="idem-key" type="text" placeholder="e.g. book-p123-july1-10am" />
        </div>
        <div class="form-group">
          <label>Actor ID</label>
          <input id="actor-id" type="text" placeholder="e.g. prosper-agent-1" value="agent-1" />
        </div>
        <div class="form-group">
          <label>Action type</label>
          <select id="action-type" onchange="updatePayload()">
            <option value="book_appointment">book_appointment</option>
            <option value="send_payment_reminder">send_payment_reminder</option>
            <option value="submit_claim">submit_claim</option>
          </select>
        </div>
        <div class="form-group">
          <label>Payload (JSON)</label>
          <textarea id="payload">{"patient_id": "p123", "slot": "2026-07-01T10:00"}</textarea>
        </div>
        <button class="btn" onclick="submitAction()" id="submit-btn">Send action</button>
        <div class="response-box" id="response-box">Response will appear here...</div>
      </div>
    </div>

    <div class="right-col">
      <div class="panel">
        <div class="panel-header" style="display:flex;justify-content:space-between;align-items:center">
          <span>Actions</span>
          <span onclick="loadActions()" style="cursor:pointer;font-size:10px;color:var(--blue);text-transform:none;letter-spacing:0">↻ refresh</span>
        </div>
        <div id="actions-table-wrap">
          <div class="loading">Loading...</div>
        </div>
      </div>

      <div class="panel audit-panel" id="audit-panel" style="display:none">
        <div class="audit-header">
          <span class="audit-title">Audit trail</span>
          <span class="audit-meta" id="audit-meta"></span>
        </div>
        <div class="timeline" id="audit-timeline">
          <div class="loading">Loading...</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const API = 'http://localhost:8000';
let selectedActionId = null;

const PAYLOADS = {
  book_appointment: '{"patient_id": "p123", "slot": "2026-07-01T10:00"}',
  send_payment_reminder: '{"debtor_id": "d001", "amount": 250, "channel": "email"}',
  submit_claim: '{"claim_id": "c001", "payer_id": "aetna", "amount": 500}'
};

function updatePayload() {
  const type = document.getElementById('action-type').value;
  document.getElementById('payload').value = PAYLOADS[type] || '{}';
}

function genKey() {
  const type = document.getElementById('action-type').value;
  const ts = Date.now().toString(36);
  return `${type.split('_')[0]}-${ts}`;
}

function statusBadge(s) {
  return `<span class="badge badge-${s}">${s}</span>`;
}

function dotClass(e) {
  const map = { created: 'created', executing: 'executing', succeeded: 'succeeded', failed: 'failed', dead: 'dead', replayed: 'replayed' };
  return `tl-dot-${map[e] || 'created'}`;
}

async function submitAction() {
  const key = document.getElementById('idem-key').value.trim() || genKey();
  document.getElementById('idem-key').value = key;
  const actorId = document.getElementById('actor-id').value.trim();
  const actionType = document.getElementById('action-type').value;
  let payload;
  try { payload = JSON.parse(document.getElementById('payload').value); }
  catch (e) { showResponse('Invalid JSON in payload', 'error'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Sending...';
  showResponse('Sending...', '');

  try {
    const res = await fetch(`${API}/v1/actions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Idempotency-Key': key },
      body: JSON.stringify({ actor_id: actorId, action_type: actionType, payload })
    });
    const data = await res.json();
    const cls = data.duplicate ? 'duplicate' : (data.action?.status === 'succeeded' ? 'success' : 'error');
    const prefix = data.duplicate ? '⚡ DUPLICATE — returned cached result\n\n' : '';
    showResponse(prefix + JSON.stringify(data.action, null, 2), cls);
    loadActions();
  } catch (e) {
    showResponse(`Could not reach API at ${API}\n\nMake sure docker compose is running.`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send action';
  }
}

function showResponse(text, cls) {
  const box = document.getElementById('response-box');
  box.textContent = text;
  box.className = 'response-box' + (cls ? ` ${cls}` : '');
}

async function loadActions() {
  try {
    const res = await fetch(`${API}/v1/actions`);
    const actions = await res.json();
    updateMetrics(actions);
    renderTable(actions);
  } catch (e) {
    document.getElementById('actions-table-wrap').innerHTML =
      '<div class="empty-state">Could not reach API. Is docker compose running?</div>';
  }
}

function updateMetrics(actions) {
  document.getElementById('m-total').textContent = actions.length;
  document.getElementById('m-succeeded').textContent = actions.filter(a => a.status === 'succeeded').length;
  document.getElementById('m-failed').textContent = actions.filter(a => a.status === 'failed').length;
  document.getElementById('m-dead').textContent = actions.filter(a => a.status === 'dead').length;
}

function renderTable(actions) {
  if (!actions.length) {
    document.getElementById('actions-table-wrap').innerHTML = '<div class="empty-state">No actions yet. Submit one above.</div>';
    return;
  }
  const rows = actions.map(a => {
    const shortId = a.id.split('-')[0];
    const retry = (a.retry_count > 0) ? `<div class="retry-info">retry ${a.retry_count}</div>` : '';
    const sel = a.id === selectedActionId ? ' selected' : '';
    return `<tr class="clickable${sel}" onclick="loadAudit('${a.id}', '${a.action_type}', '${a.actor_id}')">
      <td><span class="mono-sm">${shortId}</span></td>
      <td><span class="type-badge">${a.action_type}</span></td>
      <td>${statusBadge(a.status)}${retry}</td>
      <td class="mono-sm">${new Date(a.created_at).toLocaleTimeString()}</td>
    </tr>`;
  }).join('');

  document.getElementById('actions-table-wrap').innerHTML = `
    <table>
      <thead><tr><th>ID</th><th>Type</th><th>Status</th><th>Time</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function loadAudit(id, type, actor) {
  selectedActionId = id;
  loadActions();
  document.getElementById('audit-panel').style.display = 'block';
  document.getElementById('audit-meta').textContent = `${type} · ${actor}`;
  document.getElementById('audit-timeline').innerHTML = '<div class="loading">Loading...</div>';

  try {
    const res = await fetch(`${API}/v1/actions/${id}/audit`);
    const events = await res.json();
    if (!events.length) {
      document.getElementById('audit-timeline').innerHTML = '<div class="empty-state">No audit events yet.</div>';
      return;
    }
    const items = events.map(e => `
      <div class="timeline-item">
        <div class="tl-dot ${dotClass(e.event_type)}"></div>
        <div class="tl-content">
          <div class="tl-event">${e.event_type}</div>
          <div class="tl-time">${new Date(e.timestamp).toISOString()}</div>
          <div class="tl-payload">${JSON.stringify(e.payload_snapshot)}</div>
        </div>
      </div>`).join('');
    document.getElementById('audit-timeline').innerHTML = items;
  } catch (e) {
    document.getElementById('audit-timeline').innerHTML = '<div class="empty-state">Failed to load audit trail.</div>';
  }
}

loadActions();
setInterval(loadActions, 10000);
</script>
</body>
</html>
